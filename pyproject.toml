[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tachylog"
version = "1.0.0"
description = "GSI-Datenlogger für Leica Flexline Totalstationen — Echtzeit-Feldaufnahme via Bluetooth"
authors = [{name = "Martin Fera", email = "martin.fera@univie.ac.at"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "click>=8.0",
    "fiona>=1.9",
    "shapely>=2.0",
]

[project.scripts]
tachylog = "tachylog.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["tachylog*"]
